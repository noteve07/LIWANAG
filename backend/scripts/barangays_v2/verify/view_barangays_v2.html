<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Barangays v2 Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([14.65, 121.1], 12); // adjust center if needed
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // load local geojson file
    fetch('fetched_barangays_v2.json')
      .then(res => res.json())
      .then(data => {
        const geoLayer = L.geoJSON(data, {
          style: () => ({
            color: '#333',
            weight: 1,
            fillColor: '#66ccff',
            fillOpacity: 0.5
          }),
          onEachFeature: (feature, layer) => {
            layer.bindPopup(`<b>${feature.properties.name}</b><br>ID: ${feature.properties.id}`);
          }
        }).addTo(map);

        map.fitBounds(geoLayer.getBounds());
      });
  </script>
</body>
</html>
