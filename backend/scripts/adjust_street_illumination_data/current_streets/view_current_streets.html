<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Streets Duplicate Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
    .filter-buttons {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-family: sans-serif;
    }
    .filter-buttons button {
      margin: 2px;
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .filter-buttons button:hover {
      background: #ddd;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="filter-buttons">
    <button onclick="filterCategory('all')">All</button>
    <button onclick="filterCategory('residential')">Residential</button>
    <button onclick="filterCategory('main_road')">Main Road</button>
    <button onclick="filterCategory('highway')">Highway</button>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // init map
    const map = L.map('map').setView([14.676, 120.536], 14); // adjust to balanga / your area

    // add basemap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let allLayers; // store all streets
    let geojsonData; // raw geojson

    // color by category
    function getColor(category) {
      switch (category) {
        case 'highway': return '#e74c3c'; // red
        case 'main_road': return '#e67e22'; // orange
        case 'residential': return '#3498db'; // blue
        default: return '#7f8c8d'; // gray
      }
    }

    // style function
    function style(feature) {
      return {
        color: getColor(feature.properties.road_category),
        weight: 3,
        opacity: 0.9
      };
    }

    // load geojson
    fetch('streets_duplicate.geojson')
      .then(res => res.json())
      .then(data => {
        geojsonData = data;
        allLayers = L.geoJSON(data, {
          style: style,
          onEachFeature: (feature, layer) => {
            layer.bindPopup(`
              <b>${feature.properties.name || 'Unnamed Street'}</b><br>
              Category: ${feature.properties.road_category}<br>
              Meters: ${feature.properties.meters || 'N/A'}
            `);
          }
        }).addTo(map);

        // zoom to bounds
        map.fitBounds(allLayers.getBounds());
      });

    // filter by category
    function filterCategory(category) {
      if (allLayers) {
        map.removeLayer(allLayers);
      }
      allLayers = L.geoJSON(geojsonData, {
        style: style,
        filter: f => {
          if (category === 'all') return true;
          return f.properties.road_category === category;
        },
        onEachFeature: (feature, layer) => {
          layer.bindPopup(`
            <b>${feature.properties.name || 'Unnamed Street'}</b><br>
            Category: ${feature.properties.road_category}<br>
            Meters: ${feature.properties.meters || 'N/A'}
          `);
        }
      }).addTo(map);

      if (allLayers.getLayers().length > 0) {
        map.fitBounds(allLayers.getBounds());
      }
    }
  </script>
</body>
</html>
