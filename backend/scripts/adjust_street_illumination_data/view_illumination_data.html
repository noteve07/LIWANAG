<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Illumination Data Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- leaflet css -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- leaflet js -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // initialize map
    var map = L.map('map');

    // add osm tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // balanced colors for lux ranges
    function getColor(lux) {
      if (lux <= 5) return "#e74c3c";   // red
      else if (lux <= 12) return "#f1c40f"; // yellow
      else if (lux <= 20) return "#e67e22"; // orange
      else return "#27ae60";            // green
    }

    // load illumination_data.json
    fetch("illumination_data.json")
      .then(response => response.json())
      .then(data => {
        var markers = [];

        data.forEach(item => {
          if (item.lat && item.lon) {
            var circle = L.circleMarker([item.lat, item.lon], {
              radius: 6,
              fillColor: getColor(item.lux),
              color: "white",     // thin white border
              weight: 1,
              opacity: 1,
              fillOpacity: 0.85
            }).addTo(map);

            circle.bindPopup(`
              <b>ID:</b> ${item.id}<br>
              <b>Created:</b> ${item.created_at}<br>
              <b>Lux:</b> ${item.lux}<br>
              <b>Street ID:</b> ${item.street_id}<br>
              <b>Barangay ID:</b> ${item.barangay_id}<br>
              <b>Sensor:</b> ${item.sensor}
            `);

            markers.push(circle);
          }
        });

        // auto fit to markers
        var group = L.featureGroup(markers);
        map.fitBounds(group.getBounds(), { padding: [20, 20] });
      });
  </script>
</body>
</html>
